<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>نظام متابعة صيانة السيارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#1e3a5f;--sb-h:#26496e;--sb-a:#2563eb;--sb-t:#a8bdd4;
  --bg:#f1f4f8;--card:#fff;--border:#e3e8ef;--border2:#c8d3de;
  --txt:#1a2636;--txt2:#4f6074;--txt3:#8fa3b4;
  --acc:#2563eb;--acc-l:#eff6ff;
  --gr:#16a34a;--gr-b:#dcfce7;--gr-br:#86efac;
  --am:#b45309;--am-b:#fef3c7;--am-br:#fcd34d;
  --rd:#b91c1c;--rd-b:#fee2e2;--rd-br:#fca5a5;
  --bl:#1d4ed8;--bl-b:#eff6ff;--bl-br:#93c5fd;
  --pu:#7c3aed;--pu-b:#f5f3ff;--pu-br:#c4b5fd;
  --ar:#64748b;--ar-b:#f1f5f9;--ar-br:#cbd5e1;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.topbar{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 24px 0 16px;gap:16px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;width:240px;flex-shrink:0}
.logo-ico{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.logo-name{font-size:15px;font-weight:800}.logo-sub{font-size:11px;color:var(--txt3)}
.tb-right{margin-right:auto;display:flex;align-items:center;gap:10px}
.rbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.rbadge.supervisor{background:var(--gr-b);color:var(--gr)}
.rbadge.admin{background:var(--bl-b);color:var(--bl)}
.rbadge.maintenance{background:var(--am-b);color:var(--am)}
.rbadge.sysadmin{background:var(--pu-b);color:var(--pu)}
.uchip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:4px 14px 4px 6px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.layout{display:flex;flex:1;overflow:hidden}
.sb{width:240px;background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-sec{padding:20px 16px 6px;font-size:10px;font-weight:700;color:#5a7898;text-transform:uppercase;letter-spacing:.1em}
.ni{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:8px;margin:1px 8px;color:var(--sb-t);font-size:13px;font-weight:500;transition:all .15s}
.ni:hover{background:var(--sb-h);color:#fff}
.ni.active{background:var(--sb-a);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.4)}
.ni .ico{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.ni .lk{margin-right:auto;font-size:10px;opacity:.4}
.ni.dis{opacity:0;pointer-events:none;user-select:none;filter:blur(4px);height:0;padding:0;margin:0;overflow:hidden}
.ni.dis:hover{background:transparent;color:var(--sb-t)}
.sb-foot{margin-top:auto;padding:12px 8px;border-top:1px solid #253f5e}
.lo-btn{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:8px;color:#f87171;font-size:13px}
.lo-btn:hover{background:#1f3854}
.main{flex:1;overflow-y:auto;padding:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px}
.ph-left .pt{font-size:20px;font-weight:800}.ph-left .ps{font-size:13px;color:var(--txt3);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:14px;transition:box-shadow .15s}
.sc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.sc-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sc-num{font-size:28px;font-weight:900;line-height:1}.sc-lbl{font-size:12px;color:var(--txt3);margin-top:3px}
.sc.blue .sc-ico{background:var(--bl-b)}.sc.blue .sc-num{color:var(--bl)}
.sc.amber .sc-ico{background:var(--am-b)}.sc.amber .sc-num{color:var(--am)}
.sc.green .sc-ico{background:var(--gr-b)}.sc.green .sc-num{color:var(--gr)}
.sc.red .sc-ico{background:var(--rd-b)}.sc.red .sc-num{color:var(--rd)}
.fbar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar input,.fbar select{padding:7px 12px;font-size:13px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;color:var(--txt);outline:none;font-family:inherit;direction:rtl}
.fbar input{flex:1;min-width:180px}.fbar select{min-width:140px}
.fbar input:focus,.fbar select:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.tc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tc-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.tc-title{font-size:14px;font-weight:700}
.btn-add{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn-add:hover{opacity:.88}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:right;padding:10px 14px;font-weight:700;color:var(--txt3);font-size:11px;background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:not(.irow):not(.rrow):not(.urow):not(.arch-hdr-row):hover td{background:#fafcff}
/* archive section header row */
.arch-hdr-row td{background:var(--ar-b);padding:10px 14px;border-top:2px solid var(--ar-br);border-bottom:1px solid var(--ar-br)}
.arch-row td{background:#fafbfc;opacity:.85}
.arch-row:hover td{background:#f4f6f9 !important;opacity:1}
.arch-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ar);cursor:pointer;user-select:none}
.arch-toggle:hover{color:var(--txt)}
.seq{font-family:'Courier New',monospace;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-l);border:1px solid var(--bl-br);border-radius:6px;padding:3px 8px;white-space:nowrap}
.seq.arch{color:var(--ar);background:var(--ar-b);border-color:var(--ar-br)}
.irow td{background:#f0f7ff;padding:7px 6px;border-bottom:2px solid var(--acc)}
.irow select,.irow input{width:100%;padding:6px 9px;font-size:12px;background:#fff;border:1px solid var(--bl-br);border-radius:7px;color:var(--txt);outline:none;font-family:inherit;direction:rtl}
.irow select:focus,.irow input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.irow select:disabled{opacity:.4;background:#f1f4f8;cursor:not-allowed}
.rrow td{background:#fff8f8;padding:9px 14px;border-bottom:2px solid var(--rd-br)}
.urow td{background:#fff8f8;padding:9px 14px;border-bottom:2px solid var(--rd-br)}
.rrow textarea,.urow textarea{width:100%;padding:7px 10px;font-size:12px;border:1px solid var(--rd-br);border-radius:7px;resize:none;font-family:inherit;direction:rtl;outline:none;background:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.periodic{background:var(--gr-b);color:var(--gr);border:1px solid var(--gr-br)}
.badge.emergency{background:var(--rd-b);color:var(--rd);border:1px solid var(--rd-br)}
.badge.pending{background:var(--am-b);color:var(--am);border:1px solid var(--am-br)}
.badge.approved{background:var(--gr-b);color:var(--gr);border:1px solid var(--gr-br)}
.badge.rejected{background:var(--rd-b);color:var(--rd);border:1px solid var(--rd-br)}
.badge.done{background:var(--gr-b);color:var(--gr);border:1px solid var(--gr-br)}
.badge.undone{background:var(--rd-b);color:var(--rd);border:1px solid var(--rd-br)}
.badge.archived{background:var(--ar-b);color:var(--ar);border:1px solid var(--ar-br)}
.btn{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--txt);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.ok{background:var(--gr);color:#fff;border-color:var(--gr)}.btn.ok:hover{opacity:.88}
.btn.cl{background:var(--bg);color:var(--txt3);border-color:var(--border)}
.btn.ap{background:var(--gr);color:#fff;border-color:var(--gr);padding:5px 11px;font-size:12px}
.btn.rj{background:var(--rd-b);color:var(--rd);border-color:var(--rd-br);padding:5px 11px;font-size:12px}.btn.rj:hover{background:var(--rd);color:#fff}
.btn.ed{background:var(--bl-b);color:var(--bl);border-color:var(--bl-br)}.btn.ed:hover{background:var(--bl);color:#fff}
.btn.md{background:var(--gr);color:#fff;border-color:var(--gr);padding:4px 10px;font-size:11px}
.btn.mu{background:var(--rd-b);color:var(--rd);border-color:var(--rd-br);padding:4px 10px;font-size:11px}.btn.mu:hover{background:var(--rd);color:#fff}
.btn.del{background:var(--rd-b);color:var(--rd);border-color:var(--rd-br)}.btn.del:hover{background:var(--rd);color:#fff}
.btn.sm-cl{background:transparent;border:none;color:var(--txt3);font-size:12px;padding:4px 8px;cursor:pointer}
.img-btn{width:30px;height:30px;border-radius:8px;background:var(--acc-l);border:1px solid var(--bl-br);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;text-decoration:none}
.img-btn:hover{background:var(--acc);transform:scale(1.08)}
.fl{padding:5px 10px;background:var(--acc-l);color:var(--acc);border:1px solid var(--bl-br);border-radius:7px;font-size:11px;cursor:pointer;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.fl:hover{background:var(--acc);color:#fff}
.pill{display:inline-flex;align-items:center;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pill.amber{background:var(--am-b);color:var(--am);border:1px solid var(--am-br)}
.pill.blue{background:var(--bl-b);color:var(--bl);border:1px solid var(--bl-br)}
.pill.green{background:var(--gr-b);color:var(--gr);border:1px solid var(--gr-br)}
.dcell{display:flex;flex-direction:column;gap:2px}
.dcell .dn{font-weight:700}.dcell .dm{font-size:11px;color:var(--txt3)}
.noacc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--txt3);text-align:center}
.empty{text-align:center;padding:40px;color:var(--txt3)}
.empty .ei{font-size:40px;margin-bottom:8px}.empty .et{font-size:14px;font-weight:600}
.sa-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.rin-row{display:flex;align-items:center;gap:10px}
.rin-lbl{font-size:12px;font-weight:700;color:var(--rd);flex-shrink:0}
/* SAVE INDICATOR */
#save-indicator{position:fixed;bottom:20px;left:20px;z-index:9999;background:#16a34a;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(22,163,74,.35);opacity:0;transform:translateY(10px);transition:all .3s ease;pointer-events:none;}
#save-indicator.show{opacity:1;transform:translateY(0)}
#save-indicator.error{background:var(--rd);box-shadow:0 4px 16px rgba(185,28,28,.35)}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)}
.lb{background:#fff;border-radius:18px;padding:44px 40px;width:380px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.l-ico{width:60px;height:60px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;box-shadow:0 6px 20px rgba(37,99,235,.4)}
.lb-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px}
.lb-sub{font-size:13px;color:var(--txt3);text-align:center;margin-bottom:28px}
.lf label{font-size:12px;font-weight:700;color:var(--txt2);display:block;margin-bottom:5px}
.lf input{width:100%;padding:11px 14px;font-size:14px;border:1.5px solid var(--border);border-radius:9px;direction:rtl;outline:none;font-family:inherit;color:var(--txt);margin-bottom:14px;transition:border-color .15s}
.lf input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.l-btn{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.35)}
.l-btn:hover{opacity:.9}
.l-err{background:var(--rd-b);border:1px solid var(--rd-br);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--rd);margin-bottom:12px;display:none}
.l-hint{font-size:11px;color:var(--txt3);text-align:center;margin-top:12px}
/* Users management */
.usr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ══ WORKFLOW ══ */
.wf-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:box-shadow .15s}
.wf-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.wf-seq{font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-l);border:1px solid var(--bl-br);border-radius:6px;padding:3px 10px}
.wf-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.wf-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt3);margin-top:6px}
.wf-meta span{display:flex;align-items:center;gap:4px}
.wf-track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0}
.wf-step{display:flex;flex-direction:column;align-items:center;min-width:120px;position:relative}
.wf-step:not(:last-child)::after{content:'';position:absolute;top:18px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.wf-step.done:not(:last-child)::after{background:var(--gr)}
.wf-step.active:not(:last-child)::after{background:var(--am)}
.wf-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:2px solid var(--border);background:#fff;z-index:1;position:relative;transition:all .2s}
.wf-step.done .wf-circle{background:var(--gr-b);border-color:var(--gr);color:var(--gr)}
.wf-step.active .wf-circle{background:var(--am-b);border-color:var(--am);color:var(--am);box-shadow:0 0 0 4px rgba(180,83,9,.15)}
.wf-step.rejected-step .wf-circle{background:var(--rd-b);border-color:var(--rd);color:var(--rd)}
.wf-step.idle .wf-circle{background:#f8fafc;border-color:var(--border);color:var(--txt3)}
.wf-slbl{font-size:11px;font-weight:600;margin-top:6px;text-align:center;color:var(--txt2)}
.wf-slbl.done{color:var(--gr)}.wf-slbl.active{color:var(--am)}.wf-slbl.rejected-step{color:var(--rd)}.wf-slbl.idle{color:var(--txt3)}
.wf-stime{font-size:10px;color:var(--txt3);margin-top:2px;text-align:center}
.wf-log{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.wf-log-item{display:flex;align-items:flex-start;gap:10px;font-size:12px}
.wf-log-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0}
.wf-filter{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ══ REPORTS ══ */
.rpt-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.rpt-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-bar-lbl{font-size:12px;color:var(--txt2);width:140px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-track{flex:1;background:#f1f4f8;border-radius:20px;height:24px;overflow:hidden;position:relative}
.chart-bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;padding-right:10px;justify-content:flex-end;transition:width .4s ease;min-width:32px}
.chart-bar-val{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.kpi-card .kpi-num{font-size:22px;font-weight:900;margin-bottom:4px}
.kpi-card .kpi-lbl{font-size:11px;color:var(--txt3)}
.rpt-tbl td,.rpt-tbl th{padding:8px 12px;font-size:12px}
.rpt-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.rpt-controls select,.rpt-controls input{padding:7px 12px;font-size:13px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;color:var(--txt);outline:none;direction:rtl}
.btn-pdf{padding:7px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-pdf:hover{opacity:.88}
.btn-xl{padding:7px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-xl:hover{opacity:.88}
@media print{
  .sb,.topbar,.rpt-controls,.fbar,.wf-filter,.btn-pdf,.btn-xl,.btn-add,.btn,.ni,.lo-btn{display:none!important}
  .main{padding:0!important;overflow:visible!important}
  body{height:auto!important;overflow:visible!important}
  .layout{display:block!important}
}

/* ── MODAL ── */
#req-modal.open{display:flex!important}
.md-sec{margin-bottom:20px}
.md-sec-title{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.md-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md-kv{background:var(--bg);border-radius:8px;padding:10px 14px}
.md-kv .k{font-size:11px;color:var(--txt3);margin-bottom:3px}
.md-kv .v{font-size:14px;font-weight:700;color:var(--txt)}
.md-img-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;text-align:center;background:#f8fafc;min-height:180px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.md-img-wrap img{max-width:100%;max-height:340px;object-fit:contain;display:block}
.md-img-wrap .no-img{color:var(--txt3);font-size:13px;padding:40px}
/* timeline in modal */
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;position:relative}
.tl-item:not(:last-child) .tl-line{position:absolute;right:15px;top:32px;width:2px;height:calc(100% + 2px);background:var(--border)}
.tl-item.done .tl-line{background:var(--gr)}
.tl-item.active-tl .tl-line{background:var(--am)}
.tl-item.rej-tl .tl-line{background:var(--rd)}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid var(--border);background:#fff;position:relative;z-index:1}
.tl-item.done .tl-dot{background:var(--gr-b);border-color:var(--gr)}
.tl-item.active-tl .tl-dot{background:var(--am-b);border-color:var(--am);box-shadow:0 0 0 4px rgba(180,83,9,.12)}
.tl-item.rej-tl .tl-dot{background:var(--rd-b);border-color:var(--rd)}
.tl-item.idle-tl .tl-dot{background:#f1f5f9;border-color:var(--border)}
.tl-content{flex:1;padding-bottom:18px}
.tl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-title{font-size:13px;font-weight:700}
.tl-ts{font-size:11px;color:var(--txt3);font-family:'Courier New',monospace;background:var(--bg);padding:2px 8px;border-radius:5px}
.tl-who{font-size:12px;color:var(--txt2);margin-bottom:3px}
.tl-note{font-size:12px;color:var(--txt3);background:var(--bg);border-radius:6px;padding:6px 10px;margin-top:4px}
/* table row clickable */
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f0f7ff!important}

/* ══ RESPONSIVE — Mobile & Tablet ══ */
@media (max-width: 768px) {
  /* Layout */
  .layout{flex-direction:column}
  .sb{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px;gap:4px;overflow-x:auto}
  .sb-sec{display:none}
  .sb-foot{display:none}
  .ni{padding:8px 12px;margin:2px;min-width:auto;font-size:12px;border-radius:8px;flex-shrink:0}
  .ni .ico{font-size:14px}
  .main{padding:12px}
  /* Topbar */
  .topbar{padding:0 12px;flex-wrap:wrap;height:auto;min-height:56px;gap:8px}
  .logo{width:auto;gap:8px}
  .logo-name{font-size:13px}
  .logo-sub{display:none}
  .tb-right{gap:6px}
  .tb-right button{font-size:11px;padding:4px 8px}
  /* Stats */
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .sc{padding:14px}
  .sc-num{font-size:22px}
  .sc-ico{width:38px;height:38px;font-size:18px}
  /* Tables */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:600px}
  thead th{padding:8px 10px;font-size:10px}
  tbody td{padding:8px 10px}
  /* Filter bar */
  .fbar{padding:10px 12px;gap:8px}
  .fbar input,.fbar select{font-size:12px;padding:6px 10px;min-width:130px}
  /* Page header */
  .ph{flex-direction:column;gap:8px;margin-bottom:14px}
  .ph-left .pt{font-size:16px}
  /* SA grid */
  .sa-grid{grid-template-columns:1fr}
  /* KPI grid */
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  /* Reports charts grid */
  .rpt-section{padding:14px}
  /* Tiles login */
  #lp-step2 .ph{padding:0 16px}
  #tiles-grid{grid-template-columns:repeat(2,1fr) !important;gap:8px !important;max-width:100% !important;padding:0 12px}
  #tiles-grid > div[style*="grid-column:span 2"]{grid-column:span 2 !important}
  /* Login form */
  #lp-step1 > div{width:90% !important;padding:28px 20px !important}
  /* Modal */
  #req-modal-box{width:95% !important;margin:0 auto}
  #md-body .md-info-grid{grid-template-columns:1fr !important}
  /* Workflow */
  .wf-card{padding:14px}
  .wf-track{flex-direction:column;gap:8px}
  .wf-step{min-width:100% !important;flex-direction:row;align-items:center;gap:10px}
  .wf-step:not(:last-child)::after{display:none}
}

@media (max-width: 480px) {
  .stats{grid-template-columns:1fr 1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  #tiles-grid{grid-template-columns:1fr 1fr !important}
  .tb-right .rbadge{display:none}
  body{font-size:13px}
}

@media (min-width:769px) and (max-width:1024px) {
  .sb{width:200px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .sa-grid{grid-template-columns:1fr}
  #tiles-grid{grid-template-columns:repeat(3,1fr) !important}
}
